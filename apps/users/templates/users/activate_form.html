{% extends 'base/base.html' %}

{% block title %}Activar/Desactivar usuario {% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow">
                <div class="card-header bg-primary text-white py-3">
                    <h2 class="card-title mb-0">
                        <i class="fas fa-clipboard-list me-2"></i>
                        Activar/Desactivar usuario ({{ user.username }})
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        <div class="col-md-6">
                            <label
                                for="{{ form.is_active.id_for_label }}"
                                class="form-label fw-bold"
                            >
                                Estado del usuario <span class="text-danger">*</span>
                            </label>
                            <select
                                name="{{ form.is_active.name }}" 
                                id="{{ form.is_active.id_for_label }}"
                                class="form-control 
                                {% if form.is_active.errors %}is-invalid{% endif %}"
                                required
                            >
                                <option value="">Seleccione un estado</option>
                                <option
                                    value="True"
                                    {% if form.is_active.value %}selected{% endif %}
                                >
                                    Activo
                                </option>
                                <option
                                    value="False" {% if form.is_active.value == False %}selected{% endif %}
                                >
                                    Inactivo
                                </option>
                            </select>
                            {% if form.is_active.errors %}
                            <div class="invalid-feedback">
                                {{ form.is_active.errors.0 }}
                            </div>
                            {% endif %}
                        </div>
                        <br>
                        <!-- BOTONES -->
                        <div class="row mt-5">
                            <div class="col-12 d-flex justify-content-end gap-2">
                                <a href="{% url 'users:list' %}" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Actualizar
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
