{% extends 'registers/base/base.html' %}

{% block title %}Cambiar Contraseña{% endblock %}

{% block content %}
    <h1>Cambiar mi contraseña actual</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
        <a href="{% url 'registers:home' %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
