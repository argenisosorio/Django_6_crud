{% extends 'registers/base/base.html' %}

{% block title %}Actualizar estado del usuario{% endblock %}

{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1>Actualizar estado del usuario</h1>
                <form method="post">
                    {% csrf_token %}
                    <div>
                        <label for="{{ form.is_active.id_for_label }}" class="form-label fw-bold">
                            Estado del usuario <span class="text-danger">*</span>
                        </label>
                        <select
                            name="{{ form.is_active.name }}"
                            id="{{ form.is_active.id_for_label }}"
                            class="
                                form-control {% if form.is_active.errors %}is-invalid{% endif %}
                            "
                            required
                        >
                            <option value="">Seleccione un estado</option>
                            <option
                                value="True"
                                {% if form.is_active.value %}selected{% endif %}
                            >
                                Activo
                            </option>
                            <option
                                value="False" {% if form.is_active.value == False %}selected{% endif %}
                            >
                                Inactivo
                            </option>
                        </select>
                        {% if form.is_active.errors %}
                            <div class="invalid-feedback">
                                {{ form.is_active.errors.0 }}
                            </div>
                        {% endif %}
                    </div>
                    <br>
                    <button type="submit" class="btn btn-primary">
                        Actualizar
                    </button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
