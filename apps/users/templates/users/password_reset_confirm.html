{% extends 'registers/base/base.html' %}

{% block title %}Nueva Contraseña{% endblock %}

{% block content %}
    {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button
                type="submit"
                class="btn btn-primary"
            >
                Guardar nueva contraseña
            </button>
        </form>
    {% else %}
        <p role="alert">El enlace de recuperación no es válido o ya ha caducado.</p>
        <a
            href="{% url 'password_reset' %}"
            class="btn btn-secondary"
        >
            Solicitar un nuevo enlace
        </a>
    {% endif %}
{% endblock %}
