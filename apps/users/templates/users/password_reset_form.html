{% extends 'registers/base/base.html' %}

{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
    <h1>Recuperar Contraseña</h1>
    <p>
        Introduce tu dirección de correo electrónico y te enviaremos
        instrucciones para crear una nueva contraseña.
    </p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button
            type="submit"
            class="btn btn-primary"
        >
            Enviar correo de recuperación
        </button>
    </form>
{% endblock %}
