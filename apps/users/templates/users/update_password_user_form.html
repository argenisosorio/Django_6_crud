{% extends 'registers/base/base.html' %}

{% block title %}Actualizar contraseña del usuario{% endblock %}

{% block content %}
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1>Actualizar contraseña del usuario ({{ user.username }})</h1>
                <form method="post">
                    {% csrf_token %}
                    <div>
                        <label for="{{ form.password.id_for_label }}" class="form-label fw-bold">
                            Contraseña <span class="text-danger">*</span>
                        </label>
                        <input
                            type="password"
                            name="{{ form.password.name }}"
                            id="{{ form.password.id_for_label }}"
                            class="form-control {% if form.password.errors %}is-invalid{% endif %}"
                            required
                        />
                        {% if form.password.errors %}
                            <div class="invalid-feedback">
                                {{ form.password.errors.0 }}
                            </div>
                        {% endif %}
                    </div>
                    <br>
                    <button type="submit" class="btn btn-primary">
                        Actualizar
                    </button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
