{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Django 6 CRUD application for managing people records.">
    <meta name="author" content="Ing. Argenis Osorio">
    <title>Person CRUD</title>
    <!-- Load Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}" />
    <!-- Load Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        {% if user.is_authenticated %}
            <b>¡Hi {{ user.username }}!</b>
            <form action="/admin/logout/" method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-link p-0 m-0 align-baseline">Logout</button>
            </form>
        {% else %}
            <b>¡Hi anonymous!</b> |
            <a href=/admin>Login</a>
        {% endif %}
        <br>
        <br>
        <a href="{% url 'person:home' %}" class="btn btn-secondary">Person CRUD</a>
        <a href="{% url 'product:home' %}" class="btn btn-secondary">Product CRUD</a>
        <br>
        <br>
        {% block content %}{% endblock %}
    </div>

    <!-- Load Bootstrap JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
