{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Registro de datos">
    <meta name="author" content="Ing. Argenis Osorio">
    <title>Registro de datos</title>
    <!-- Load Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}" />
    <!-- Load Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid mt-4">
        {% if user.is_authenticated %}
            ¡Hola {{ user.username }}! |
            <a href="{% url 'registers:home' %}">Lista de Registros</a> |
            <a href="{% url 'registers:graphics' %}">Gráficos</a> |
            <a href="{% url 'users:logout' %}">Cerrar sesión</a>
        {% endif %}
        <br>
        <br>
        {% block content %}{% endblock %}
    </div>

    <!-- Load Bootstrap JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
