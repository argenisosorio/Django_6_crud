{% extends 'registers/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Gráficos</h1>
</div>

<h4>Total de registros: {{ registers|length }}</h4>

<br>

{% if registers %}
    <div class="row mb-4">
        <div class="col-md-4 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="card-title mb-0 text-center">Distribución por Municipio</h5>
                </div>
                <div class="card-body">
                    <canvas id="municipioChart" width="200" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>
{% endif %}

<script>
    function renderizarGrafico() {
        const canvas = document.getElementById('municipioChart');
        const ctx = canvas.getContext('2d');
        
        const labels = {{ chart_labels|safe }};
        const data = {{ chart_data|safe }};
        
        if (labels.length === 0) {
            canvas.parentElement.innerHTML = '<div class="alert alert-info text-center">No hay datos para mostrar</div>';
            return;
        }

        // Paleta de colores extendida
        const coloresVibrantes = [
            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', 
            '#FF9F40', '#C9CBCF', '#7BC225', '#B3DEE2', '#F7464A',
            '#46BFBD', '#FDB45C', '#949FB1', '#4D5360', '#AC64AD',
            '#5175AE', '#E2EAE9', '#2D3436', '#D63031', '#00B894'
        ];

        // Destruir gráfico existente si hay
        if (window.municipioChart instanceof Chart) {
            window.municipioChart.destroy();
        }

        window.municipioChart = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: coloresVibrantes.slice(0, labels.length),
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { 
                        position: 'bottom',
                        labels: {
                            boxWidth: 12,
                            padding: 15,
                            font: { size: 11 }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw || 0;
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                return `${label}: ${value} registros (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', renderizarGrafico);
</script>

{% endblock %}
