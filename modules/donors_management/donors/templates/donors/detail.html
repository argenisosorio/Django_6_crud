{% extends 'donors/base.html' %}

{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white">
        <h2>Donor Detai</h2>
    </div>
    <div class="card-body">
        <ul class="list-group list-group-flush">
            <li class="list-group-item"><strong>Name:</strong> {{ donor.name }}</li>
            <li class="list-group-item"><strong>Email:</strong> {{ donor.email }}</li>
            <li class="list-group-item"><strong>Actualizado:</strong> {{ donor.updated_at|date:"d/m/Y H:i" }}</li>
        </ul>
    </div>
    <div class="card-footer">
        <a href="{% url 'donors:update' donor.pk %}" class="btn btn-warning">Update</a>
        <a href="{% url 'donors:delete' donor.pk %}" class="btn btn-danger">Delete</a>
        <a href="{% url 'donors:home' %}" class="btn btn-secondary">Back to list</a>
    </div>
</div>
{% endblock %}
